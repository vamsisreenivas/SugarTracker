<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-Meal Sugar Tracker</title>
    <style>
        :root { 
            --primary: #2563eb; 
            --bg: #f8fafc; 
            --card: #ffffff; 
            --text: #1e293b; 
            --border: #e2e8f0; 
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; 
            background-color: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: 16px; 
            display: flex; 
            justify-content: center; 
        }
        .container { 
            width: 100%; 
            max-width: 550px; 
            background: var(--card); 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); 
        }
        h2, h3 { margin-top: 0; color: #0f172a; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        textarea { resize: vertical; height: 60px; }
        
        button { width: 100%; background-color: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 12px; }
        button:hover { background-color: #1d4ed8; }
        
        /* Ecosystem Sync Box Layout */
        .sync-panel { 
            background: #f1f5f9; 
            padding: 16px; 
            border-radius: 8px; 
            margin-bottom: 20px; 
            border: 1px dashed #cbd5e1;
        }
        .sync-btn-group {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }
        .sync-btn-group button {
            margin-bottom: 0;
            padding: 10px;
            font-size: 14px;
        }
        
        .history-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        .history-table th, .history-table td { border: 1px solid var(--border); padding: 10px; text-align: left; }
        .history-table th { background-color: #f1f5f9; }
        .delete-btn { background: #ef4444; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .date-cell { white-space: nowrap; color: #64748b; font-size: 12px; }
        .status-msg { font-size: 13px; color: #16a34a; font-weight: 600; margin-bottom: 12px; text-align: center; height: 18px; }
    </style>
</head>
<body>
<div class="container">
    <h2>Pre-Meal Sugar Tracker</h2>
    
    <div id="status" class="status-msg"></div>

    <!-- Apple Ecosystem Cross-Browser Data Sync Box -->
    <div class="sync-panel">
        <label style="margin-bottom:2px;">🔄 Device Link &amp; Sync Panel</label>
        <span style="font-size:11px; color:#64748b; display:block; margin-bottom:10px;">Move your logs instantly from Mac Chrome to iPhone Safari.</span>
        
        <div class="sync-btn-group">
            <button style="background-color: #475569;" onclick="copySyncCode()">📋 1. Copy Log Code on Mac</button>
            <button style="background-color: #0d9488;" onclick="pasteSyncCode()">📥 2. Import Code on iPhone</button>
        </div>
    </div>

    <div class="form-group"><label for="date">Date</label><input type="date" id="date" required></div>
    <div class="form-group"><label for="sugar">GRBS Sugar Level (mg/dL)</label><input type="number" id="sugar" placeholder="e.g., 110" required></div>
    <div class="form-group"><label for="meal">Meal Type</label><select id="meal"><option value="Before Breakfast">Before Breakfast</option><option value="Before Lunch">Before Lunch</option><option value="Before Dinner">Before Dinner</option></select></div>
    <div class="form-group"><label for="food">Food Items Planned</label><textarea id="food" placeholder="e.g., 2 Oats idli"></textarea></div>
    
    <button onclick="saveLog()">Save Reading</button>

    <h3>History &amp; Logs</h3>
    <table class="history-table">
        <thead><tr><th>Date</th><th>Meal</th><th>Sugar</th><th>Food</th><th>Action</th></tr></thead>
        <tbody id="historyBody"></tbody>
    </table>
</div>

<script>
    let logs = JSON.parse(localStorage.getItem('sugarLogs')) || [];
    
    window.onload = function() { 
        document.getElementById('date').value = new Date().toISOString().split('T'); 
        renderHistory();
    };

    function showStatus(text, isError = false) {
        const msgDiv = document.getElementById('status');
        msgDiv.style.color = isError ? "#ef4444" : "#16a34a";
        msgDiv.innerText = text;
        setTimeout(() => { msgDiv.innerText = ''; }, 4000);
    }

    function copySyncCode() {
        if(logs.length === 0) {
            alert("No logs recorded yet to copy!");
            return;
        }
        const tokenStr = btoa(unescape(encodeURIComponent(JSON.stringify(logs))));
        navigator.clipboard.writeText(tokenStr).then(() => {
            showStatus("✅ Copied! Now open iPhone Safari and click Import.");
        }).catch(() => {
            alert("Failed to access clipboard automatically. Please try again.");
        });
    }

    async function pasteSyncCode() {
        try {
            const rawText = await navigator.clipboard.readText();
            if(!rawText) {
                alert("Your clipboard is empty! Make sure you clicked 'Copy Log Code' on your Mac first.");
                return;
            }
            const decodedData = JSON.parse(decodeURIComponent(escape(atob(rawText.trim()))));
            if(Array.isArray(decodedData)) {
                if(confirm(`Found ${decodedData.length} records. Merge with this device?`)) {
                    // Combines logs uniquely keeping records intact
                    logs = decodedData;
                    localStorage.setItem('sugarLogs', JSON.stringify(logs));
                    renderHistory();
                    showStatus("🎉 History Imported Successfully!");
                }
            } else {
                showStatus("❌ Invalid code layout detected.", true);
            }
        } catch(e) {
            alert("To import, tap the screen once, give Safari permission to paste, or ensure your Mac copy was successful.");
        }
    }

    function renderHistory() {
        const tbody = document.getElementById('historyBody'); tbody.innerHTML = '';
        const sortedLogs = [...logs].reverse();
        sortedLogs.forEach((log, revIdx) => {
            const orgIdx = logs.length - 1 - revIdx; const row = document.createElement('tr');
            let formattedDate = log.date;
            try { formattedDate = new Date(log.date).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }); } catch(e) {}
            row.innerHTML = `<td class="date-cell">${formattedDate}</td><td><strong>${log.meal}</strong></td><td>${log.sugar} mg/dL</td><td>${log.food || '—'}</td><td><button class="delete-btn" onclick="deleteLog(${orgIdx})">Delete</button></td>`;
            tbody.appendChild(row);
        });
    }

    function saveLog() {
        const date = document.getElementById('date').value; const sugar = document.getElementById('sugar').value; const meal = document.getElementById('meal').value; const food = document.getElementById('food').value;
        if (!date || !sugar) { alert('Please enter all fields.'); return; }
        
        logs.push({ date, sugar, meal, food }); 
        localStorage.setItem('sugarLogs', JSON.stringify(logs));
        document.getElementById('sugar').value = ''; 
        document.getElementById('food').value = ''; 
        renderHistory();
        showStatus('💾 Reading saved to device!');
    }

    function deleteLog(index) { 
        if(confirm('Delete this entry?')) { 
            logs.splice(index, 1); 
            localStorage.setItem('sugarLogs', JSON.stringify(logs)); 
            renderHistory(); 
            showStatus('❌ Entry Deleted!');
        } 
    }
</script>
</body>
</html>
